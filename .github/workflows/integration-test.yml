name: "Build experimental D3D11On12 GPU harnesses"

# Build-only on hosted macOS: actual GPU acceptance requires an isolated
# Wine/GPTK runtime with D3DMetal and the separately built dxilconv dependency.
# See docs/FIRST-FRAME-VALIDATION.md. A green build is not a rendering result.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e2e-harnesses:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM-MinGW
        run: brew install llvm-mingw

      - name: Cross-compile the E2E harnesses
        run: |
          set -euo pipefail
          # The triangle harness is the MVP target: VS+PS, one render target,
          # a draw, and a staging readback.  It mirrors, at the application
          # level, what tests/d3d11ddi_triangle.c asserts at the DDI level.
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -o d3d11_e2e_triangle.exe tests/e2e_d3d11_triangle.cpp \
            -ld3d11 -ld3d12 -ld3dcompiler -ldxgi -luuid
          # The compute harness is kept as a future target.  It exercises a
          # compute shader and a UAV, neither of which is in the MVP scope
          # described by docs/D3D11ON12.md §Out-of-scope, so it will stay
          # unrunnable for longer than the triangle does.
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 \
            -o d3d11_e2e_harness.exe tests/e2e_d3d11_harness.cpp \
            -ld3d11 -ld3dcompiler

      - name: Report why execution is skipped
        run: |
          echo 'Both harnesses cross-compiled; neither executed on this runner.'
          echo 'Triangle execution requires the experimental host, real driver,'
          echo 'dxilconv.dll, and a configured isolated Wine/D3DMetal runtime.'
          echo 'The compute harness remains outside the supported frame surface.'


      - name: Upload the harnesses
        uses: actions/upload-artifact@v7
        with:
          name: e2e-harnesses-${{ github.sha }}
          path: |
            d3d11_e2e_triangle.exe
            d3d11_e2e_harness.exe
          if-no-files-found: error
          retention-days: 14
