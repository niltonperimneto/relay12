name: "GPTK4 D3D11->Metal E2E Integration"

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e-matrix-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta & Dependencies
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "rosetta ok"
          brew install mingw-w64 wget

      - name: Compile E2E Harness (MinGW)
        run: |
          # Cross compile the E2E Windows application 
          x86_64-w64-mingw32-g++ -O2 -o d3d11_e2e_harness.exe tests/e2e_d3d11_harness.cpp -ld3d11 -ld3dcompiler

      - name: Fetch & Setup Minimal Wine+GPTK4 Environment
        run: |
          # In a real environment, you pull down the compiled GPTK artifact from the repo 
          # or use a cached Whisky/Wine-CX layer.
          echo "Setting up WINEPREFIX and ensuring GPTK4 d3dmetal.dll is hooked"
          # Mock:
          # wget https://.../wineCX.tar.gz && tar xf wineCX.tar.gz
          # export WINEPREFIX=$PWD/wineprefix
          # WINEDLLOVERRIDES="d3d11=n,b;dxgi=n,b" wine d3d11_e2e_harness.exe
          echo "Done setup"

      - name: Execute Relay Pipeline Validation
        run: |
          # Here we run the E2E harness which triggers D3D11 -> relay12 -> D3D12 -> GPTK -> Metal.
          # The script returns exit code 0 if all memory outputs map exactly as expected.
          
