name: pull request validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-d3d11on12:
    runs-on: ubuntu-26.04
    env:
      WINEDEBUG: -all
      # The tests are console programs; never wait on a mono or gecko install.
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify dependency licenses and revisions
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f third_party/D3D11On12/LICENSE
          test -f third_party/D3D12TranslationLayer/LICENSE
          test -f third_party/DirectX-Headers/LICENSE
          test "$(git -C third_party/D3D11On12 rev-parse HEAD)" = \
            5d8898b43d817e0fd0f58ed87ef645c0cf6fac27
          test "$(git -C third_party/D3D12TranslationLayer rev-parse HEAD)" = \
            b68ebbc6dab4195f7d4819ea78f2a60c985b853a
          test "$(git -C third_party/DirectX-Headers rev-parse HEAD)" = \
            9e393d6d8a3b30dcc6f2806ef604ec16a27b0d7e
          if git ls-files | grep -Eiq '(^|/)(d3d10umddi|d3d11umddi)\.h$'; then
            echo 'proprietary WDK headers must not be committed' >&2
            exit 1
          fi

      - name: Prepare the pinned D3D11On12 MinGW port series
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          worktree="$RUNNER_TEMP/d3d11on12-port-source"
          git clone --quiet --no-hardlinks third_party/D3D11On12 "$worktree"
          scripts/prepare-d3d11on12-source.sh "$worktree"
          git -C "$worktree" -c core.whitespace=cr-at-eol diff --check
          test -n "$(git -C "$worktree" diff --stat)"
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_com_ptr_test.cpp \
            -o "$RUNNER_TEMP/relay_com_ptr_test"
          "$RUNNER_TEMP/relay_com_ptr_test"
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_ownership_negative.cpp \
            -o "$RUNNER_TEMP/relay_ownership_negative"
          if "$RUNNER_TEMP/relay_ownership_negative"; then
            echo 'live COM output slot did not fail closed' >&2
            exit 1
          fi

      - name: Measure the pinned D3D12TranslationLayer portability baseline
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          worktree="$RUNNER_TEMP/dtl-port-source"
          git clone --quiet --no-hardlinks third_party/D3D12TranslationLayer "$worktree"
          scripts/prepare-dtl-source.sh "$worktree"
          git -C "$worktree" -c core.whitespace=cr-at-eol diff --check
          # A bypassed struct-returning call fails the MinGW build anyway;
          # this names the call and its wrapper instead of surfacing as a
          # cross-compile error, and it covers the MSVC branch too.
          python3 scripts/check_dtl_struct_return.py "$worktree"
          # The core transcribes the driver's adapter arguments rather than
          # including a header that needs the licensed overlay. A copy passed
          # by address to separately compiled code cannot be allowed to drift.
          python3 scripts/check_adapter_args.py
          # The driver dereferences the core-layer callback table without
          # checking it. An entry nobody assigns compiles and links, and
          # crashes inside D3D11On12 on the first flush.
          python3 scripts/check_core_callbacks.py
          # Linux filename semantics are part of the port contract. A local
          # build on a case-insensitive filesystem cannot establish this.
          python3 scripts/check_dtl_include_case.py "$worktree"
          python3 scripts/check_dtl_include_case.py \
            "$RUNNER_TEMP/d3d11on12-port-source" --include-root "$worktree"
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_hresult_error_test.cpp \
            -o "$RUNNER_TEMP/relay_hresult_error_test"
          "$RUNNER_TEMP/relay_hresult_error_test"
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_hresult_error_negative.cpp \
            -o "$RUNNER_TEMP/relay_hresult_error_negative"
          if "$RUNNER_TEMP/relay_hresult_error_negative"; then
            echo 'non-HRESULT exception was swallowed at HRESULT boundary' >&2
            exit 1
          fi
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_tracelogging_test.cpp \
            -o "$RUNNER_TEMP/relay_tracelogging_test"
          "$RUNNER_TEMP/relay_tracelogging_test"
          # The provider handle is a distinct type on purpose: the no-op macros
          # never inspect their arguments, so nothing else would catch a
          # refactor that passed the wrong pointer.
          if c++ -std=c++17 -Wall -Wextra -Werror -Icompat \
              -c tests/relay_tracelogging_negative.cpp -o /dev/null; then
            echo 'a provider handle accepted an unrelated pointer' >&2
            exit 1
          fi
          # Both ABI branches, on one compiler. A wrong expansion here does
          # not fail to compile; it returns a zeroed descriptor.
          # Silent failure mode: a detector answering false for a field the
          # destination does have would just not copy it, with no diagnostic.
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Icompat tests/relay_member_detect_test.cpp \
            -o "$RUNNER_TEMP/relay_member_detect_test"
          "$RUNNER_TEMP/relay_member_detect_test"
          for selector in 0 1; do
            c++ -std=c++17 -Wall -Wextra -Werror -Icompat \
              "-DRELAY_D3D12_STRUCT_RETURN_VIA_OUT_PARAM=$selector" \
              tests/relay_d3d12_struct_return_test.cpp \
              -o "$RUNNER_TEMP/relay_struct_return_$selector"
            "$RUNNER_TEMP/relay_struct_return_$selector"
          done

      - name: Test the gates
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          # First, because it needs no toolchain and takes a second: a gate
          # whose pattern has stopped matching fails silently, staying green
          # while it withholds the signal it exists for.  These give every
          # rule something that breaks it.  Running them here is also the only
          # thing that runs them: the checks below are still inline heredocs,
          # and migrating those to scripts/check_*.py is separate work.
          python3 -m unittest discover -s tests -p 'test_*.py' --verbose
          python3 scripts/check_secure_code.py relay12-d3d11

      - name: Install MinGW-w64 GCC and Wine
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install --yes \
            cmake curl unzip wine bison flex
          # Wine refuses to create a prefix under a directory it does not own,
          # and the prefix stays out of the workspace so it is never packaged
          # or uploaded.
          echo "WINEPREFIX=$HOME/.wine-d3d11on12" >> "$GITHUB_ENV"
          WINEPREFIX="$HOME/.wine-d3d11on12" wineboot --init

      - name: Verify Wine patches
        env:
          WINECX_REPO: https://github.com/dappermint/winecx.git
          WINECX_COMMIT: 7dbc5b5322a6ef3fb04bdc643c64b188fd641149
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          git clone --filter=blob:none "$WINECX_REPO" winecx
          git -C winecx checkout --detach "$WINECX_COMMIT"
          for patch in "$PWD"/patches/*.patch; do
            [ -e "$patch" ] || break
            git -C winecx apply --check "$patch"
            git -C winecx apply "$patch"
          done
          python3 scripts/check_wine_d3d11_backend.py winecx
          # The diagnostics resolve __wine_dbg_output at run time so the router
          # and the core keep importing only kernel32 and the C runtime, with
          # no ntdll entry of their own.  It is a
          # Wine-internal, unversioned export, so a Wine bump that drops it
          # must fail here rather than silently losing every deployment
          # diagnostic to an application that handles DBG_PRINTEXCEPTION_C.
          if ! grep -q '__wine_dbg_output' winecx/dlls/ntdll/ntdll.spec; then
            echo 'the pinned Wine no longer exports __wine_dbg_output' >&2
            exit 1
          fi
          # The pinned llvm-mingw is the ucrt build, so snprintf and fputs
          # link against these api-set stubs rather than msvcrt.dll.  Wine
          # ships no api-ms-win-crt-* module: it resolves them through the
          # apiset schema, and every one of them has to land on a builtin the
          # prefix actually has, or both modules fail to load with a missing
          # dependency rather than anything that names this cause.
          for set in environment heap private runtime stdio string time; do
            if ! grep -q "^apiset api-ms-win-crt-$set-l1-1-0 = ucrtbase.dll$" \
                winecx/dlls/apisetschema/apisetschema.spec; then
              echo "the pinned Wine no longer maps api-ms-win-crt-$set-l1-1-0 to ucrtbase" >&2
              exit 1
            fi
          done
          test -f winecx/dlls/ucrtbase/Makefile.in

      - name: Compile the patched Wine D3D11 frontend and host
        run: |
          scripts/build-wine-d3d11-host.sh "$PWD/winecx" "$RUNNER_TEMP/wine-host-build"

      - name: Compile the D3D12TranslationLayer dependency edge
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -static-libgcc -static-libstdc++ \
            -Icompat tests/relay_com_ptr_test.cpp \
            -o "$RUNNER_TEMP/relay_ownership_test.exe"
          wine "$RUNNER_TEMP/relay_ownership_test.exe"
          # The ETW shim has to mean the same thing to MinGW as it does to the
          # native compiler, so the contract test runs in both lanes.
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -static-libgcc -static-libstdc++ \
            -Icompat tests/relay_tracelogging_test.cpp \
            -o "$RUNNER_TEMP/relay_tracelogging_test.exe"
          wine "$RUNNER_TEMP/relay_tracelogging_test.exe"
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -static-libgcc -static-libstdc++ \
            -Icompat tests/relay_d3d12_struct_return_test.cpp \
            -o "$RUNNER_TEMP/relay_struct_return.exe"
          wine "$RUNNER_TEMP/relay_struct_return.exe"
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -static-libgcc -static-libstdc++ \
            -Icompat tests/relay_member_detect_test.cpp \
            -o "$RUNNER_TEMP/relay_member_detect.exe"
          wine "$RUNNER_TEMP/relay_member_detect.exe"
          worktree="$RUNNER_TEMP/dtl-port-source"
          # A positive milestone now, not an expected failure. ATL, _com_error,
          # the D3DKMT present path and the SDK ETW header are all behind us,
          # and nothing else in the dependency edge is unavailable to MinGW, so
          # preprocessing the whole edge has to succeed. A regression here is a
          # newly introduced dependency, and the diagnostic names it.
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -I"$worktree/include" -I"$worktree/external" \
            -Ithird_party/DirectX-Headers/include \
            -fsyntax-only tests/dtl_dependency_probe.cpp
          # And the SDK ETW header must not have come back by another route.
          if grep -rn 'include *[<"]traceloggingprovider' "$worktree/include" \
              "$worktree/src"; then
            echo 'the SDK TraceLogging header reappeared in the prepared tree' >&2
            exit 1
          fi

      - name: Build every D3D12TranslationLayer translation unit
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          worktree="$RUNNER_TEMP/dtl-port-source"
          overlay="$RUNNER_TEMP/windows-sdk-overlay"
          build="$RUNNER_TEMP/dtl-build"
          scripts/prepare-windows-sdk-overlay.sh "$overlay"
          # Generate dependencies using the same clean-room include root used
          # by the layout tests. CPATH or a future workflow refactor that leaks
          # the overlay into these compiles is therefore visible and fatal.
          cleanroom_deps="$RUNNER_TEMP/cleanroom-deps"
          mkdir -p "$cleanroom_deps"
          for source in tests/d3d11ddi*.c; do
            name=$(basename "$source" .c)
            x86_64-w64-mingw32-gcc -std=gnu11 \
              -Irelay12-d3d11 -Irelay12-d3d11/ddi \
              -MM -MF "$cleanroom_deps/$name.d" "$source"
          done
          python3 scripts/check_cleanroom_isolation.py --overlay "$overlay" \
            "$cleanroom_deps"/*.d
          cmake -S "$worktree" -B "$build" -G 'Unix Makefiles' \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DDTL_DIRECTX_HEADERS_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/DirectX-Headers" \
            -DDTL_WINDOWS_SDK_OVERLAY_DIR="$overlay" \
            -DDTL_ENABLE_WDK_DXBC=ON
          cmake --build "$build" --parallel 2
          python3 - "$build" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          build = Path(sys.argv[1])
          expected = {
              build / "src/libd3d12translationlayer.a": 31,
              build / "src/libd3d12translationlayer_wdk.a": 4,
              build / "DxbcParser/libdxbcparser.a": 2,
          }
          for archive, count in expected.items():
              members = subprocess.check_output(
                  ["x86_64-w64-mingw32-ar", "t", archive], text=True
              ).splitlines()
              if len(members) != count or len(set(members)) != count:
                  raise SystemExit(
                      f"{archive}: {len(members)} members ({len(set(members))} unique), "
                      f"expected {count}"
                  )
          print("DTL archive translation-unit manifest: ok")
          PY

      - name: Link D3D11On12 against the portable translation layer
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          driver="$RUNNER_TEMP/d3d11on12-port-source"
          dtl="$RUNNER_TEMP/dtl-port-source"
          overlay="$RUNNER_TEMP/windows-sdk-overlay"
          build="$RUNNER_TEMP/d3d11on12-build"
          cmake -S "$driver" -B "$build" -G 'Unix Makefiles' \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DD3D11ON12_DTL_SOURCE_DIR="$dtl" \
            -DD3D11ON12_WINDOWS_KITS_INCLUDE_DIRS="$overlay" \
            -DDTL_DIRECTX_HEADERS_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/DirectX-Headers" \
            -DDTL_WINDOWS_SDK_OVERLAY_DIR="$overlay" \
            -DDTL_ENABLE_WDK_DXBC=ON
          cmake --build "$build" --parallel 2
          python3 scripts/check_driver_resource_abi.py "$build/compile_commands.json"

          dll="$build/src/d3d11on12.dll"
          test -s "$dll"
          # Through the tested gate rather than an inline scrape. The inline
          # version read GNU binutils objdump's export table, and llvm-mingw's
          # objdump is llvm-objdump, which prints a different one -- so the
          # check silently found zero exports and failed with nothing to read.
          python3 "$GITHUB_WORKSPACE/scripts/check_pe_audit.py" \
            --require-export OpenAdapter_D3D11On12 "$dll"
          x86_64-w64-mingw32-objdump -p "$dll" | grep 'DLL Name:'

      - name: Compile D3D11-on-12 conformance probe
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror \
            -o d3d11on12probe.exe tests/d3d11on12probe.c \
            -ld3d11 -ld3d12 -ldxgi -ldxguid -luuid
          x86_64-w64-mingw32-objdump -p d3d11on12probe.exe \
            | grep -q D3D11On12CreateDevice

      - name: Compile and audit D3D11 router
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          x86_64-w64-mingw32-g++ -shared -std=c++17 -O2 \
            -Wall -Wextra -Werror -fno-exceptions -fno-rtti \
            -fno-threadsafe-statics -fno-use-cxa-atexit \
            -Irelay12-d3d11 -Irelay12-d3d11/ddi \
            -Ithird_party/D3D11On12/interface \
            -o d3d11on12core.dll relay12-d3d11/d3d11on12core.cpp \
            relay12-d3d11/wine_d3d11_diag.cpp \
            relay12-d3d11/d3d11on12core.def -ld3d12 -ldxgi -luuid
          x86_64-w64-mingw32-g++ -shared -std=c++17 -O2 \
            -Wall -Wextra -Werror -fno-exceptions -fno-rtti \
            -fno-threadsafe-statics -fno-use-cxa-atexit \
            -o d3d11shim.dll relay12-d3d11/d3d11shim.cpp \
            relay12-d3d11/wine_d3d11_diag.cpp \
            relay12-d3d11/d3d11shim.def -ld3d11 -ldxgi
          # Through the tested gate rather than four inline scrapes. This step
          # re-implemented the export table, the import table and the C++
          # runtime rule that scripts/check_pe_audit.py already owns and has
          # tests for, and its ordinal scrape read GNU binutils objdump's
          # format -- llvm-mingw's objdump is llvm-objdump, which prints a
          # different one, so it raised AttributeError on a failed match.
          # The eighteen per-name greps that stood here are covered too: the
          # gate compares the whole ordinal table, which is strictly stronger
          # than asserting each name appears somewhere in the output.
          python3 "$GITHUB_WORKSPACE/scripts/check_pe_audit.py" \
            d3d11shim.dll d3d11on12core.dll

      - name: Audit interface acquisition
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          python3 - <<'PY'
          import pathlib
          import re

          # A QueryInterface or GetDevice that reports S_OK with a null
          # out-pointer breaks the COM contract, and the D3DMetal payload does
          # it.  strictResult is the single place that rule lives; a call that
          # checks only the HRESULT is how a queue belonging to another device
          # got accepted.  Keep the funnel mandatory rather than remembered.
          acquisition = re.compile(r"->(QueryInterface|GetDevice)\s*\(")
          errors = []
          for path in sorted(pathlib.Path("relay12-d3d11").rglob("*.cpp")):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if not acquisition.search(line):
                      continue
                  if "strictResult(" in line:
                      continue
                  errors.append(f"{path}:{number}: an interface acquisition "
                                "must pass its holder through strictResult()")
          if errors:
              raise SystemExit("\n".join(errors))
          print("interface acquisition audit: ok")
          PY
          # A D3D11 device is used concurrently by design, and neither module
          # is a Wine builtin, so neither gets Wine's locking for free.  A
          # race added at namespace scope here would not fail a test; it would
          # fail a game, once, on someone else's machine.
          python3 scripts/check_shared_state.py
          # The WDK DDI structures are not packed.  pack(1) would break every
          # asserted offset and pack(8) would be a no-op that hides the real
          # alignment from WINE_DDI_ASSERT_ALIGN.
          # Anchored at the start of the line: the header states this rule in
          # a comment, and stating it must not trip it.
          if grep -rEn '^[[:space:]]*#[[:space:]]*pragma[[:space:]]+pack' \
              relay12-d3d11/ddi; then
            echo 'pragma pack is prohibited in the DDI declarations' >&2
            exit 1
          fi

      - name: Run D3D11-on-12 core validation tests
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          for source in d3d11on12core wine_d3d11_diag; do
            x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror \
              -fno-exceptions -fno-rtti -fno-threadsafe-statics \
              -fno-use-cxa-atexit \
              -Irelay12-d3d11 -Irelay12-d3d11/ddi \
              -Ithird_party/D3D11On12/interface \
              -c -o "$source.o" "relay12-d3d11/$source.cpp"
          done
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -c -o d3d11on12coretest.o tests/d3d11on12coretest.c
          # The adapter entry point must reject every malformed call before it
          # loads the driver, so a bad call cannot reach it at all.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -c -o d3d11on12openadapter.o \
            tests/d3d11on12openadapter.c
          # -Irelay12-d3d11 as well as ddi: the mock takes the sub-object slot
          # indices from d3d11on12core.h instead of transcribing the interface
          # a second time.
          x86_64-w64-mingw32-gcc -shared -std=gnu11 -O2 \
            -Wall -Wextra -Werror -Irelay12-d3d11 -Irelay12-d3d11/ddi \
            -o d3d11on12.dll tests/d3d11on12mockdriver.c \
            -ldxgi
          # Linking with the C driver keeps the no-C++-runtime rule honest: if
          # the core ever needs libstdc++, this link fails.
          x86_64-w64-mingw32-gcc -o d3d11on12coretest.exe \
            d3d11on12coretest.o d3d11on12core.o wine_d3d11_diag.o \
            -ld3d12 -ldxgi -ldxguid -luuid
          if x86_64-w64-mingw32-objdump -p d3d11on12coretest.exe \
              | grep -Eiq 'libstdc\+\+|libgcc_s'; then
            echo 'unexpected C++ runtime dependency' >&2
            exit 1
          fi
          wine d3d11on12coretest.exe
          x86_64-w64-mingw32-gcc -o d3d11on12openadapter.exe \
            d3d11on12openadapter.o d3d11on12core.o wine_d3d11_diag.o \
            -ld3d12 -ldxgi -ldxguid -luuid
          WINEDLLOVERRIDES=d3d11on12=n wine d3d11on12openadapter.exe
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12frame.exe tests/d3d11on12frame.c \
            d3d11on12core.o wine_d3d11_diag.o -ld3d12 -ldxgi -ldxguid -luuid
          WINEDLLOVERRIDES=d3d11on12=n wine d3d11on12frame.exe
          x86_64-w64-mingw32-clang -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12wrapped.exe tests/d3d11on12wrapped.c \
            d3d11on12core.o wine_d3d11_diag.o -ld3d12 -ldxgi -ldxguid -luuid
          WINEDLLOVERRIDES=d3d11on12=n wine d3d11on12wrapped.exe
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12deferred.exe tests/d3d11on12deferred.c \
            d3d11on12core.o wine_d3d11_diag.o -ld3d12 -ldxgi -ldxguid -luuid
          WINEDLLOVERRIDES=d3d11on12=n wine d3d11on12deferred.exe
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12pso.exe tests/d3d11on12pso.c \
            d3d11on12core.o wine_d3d11_diag.o -ld3d12 -ldxgi -ldxguid -luuid
          WINEDLLOVERRIDES=d3d11on12=n wine d3d11on12pso.exe
          # Host dispatch overhead, with RELAY12_TELEMETRY off and on.  The
          # timings go to the job summary and never fail the job -- a shared
          # runner under Wine is too noisy for a threshold.  The telemetry
          # report is not noise: summarize_overhead.py fails if one is printed
          # with the switch off, or if its counts disagree with what the
          # benchmark dispatched.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12overhead.exe \
            tests/d3d11on12overhead.c d3d11on12core.o wine_d3d11_diag.o \
            -ld3d12 -ldxgi -ldxguid -luuid
          for mode in off on; do
            telemetry=; [ "$mode" = on ] && telemetry=1
            if ! WINEDLLOVERRIDES=d3d11on12=n RELAY12_TELEMETRY=$telemetry \
                wine d3d11on12overhead.exe \
                > "overhead-$mode.out" 2> "overhead-$mode.err"; then
              cat "overhead-$mode.out" "overhead-$mode.err"
              exit 1
            fi
            cat "overhead-$mode.out"
          done
          python3 scripts/summarize_overhead.py \
            overhead-off.out overhead-off.err overhead-on.out overhead-on.err \
            --draws 600000 --flushes 50000 --command-lists 20000 \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run compiled frontend lifetime and unsupported-operation tests
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/wine-host-build/dlls/d3d11on12host/x86_64-windows/d3d11on12host.dll" .
          x86_64-w64-mingw32-clang -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11on12frontend.exe tests/d3d11on12frontend.c \
            -ld3dcompiler -ldxguid -luuid
          WINEDLLOVERRIDES='d3d11on12,d3d11on12core=n;d3d11on12host=b;mscoree,mshtml=' \
            timeout 60s wine d3d11on12frontend.exe
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -o d3d11_e2e_triangle.exe \
            tests/e2e_d3d11_triangle.cpp -ld3d12 -ld3dcompiler -luuid
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -o d3d11_e2e_wrapped.exe \
            tests/e2e_d3d11_wrapped.cpp -ld3d12 -luuid
          # Compiled only: it needs a real D3D12 under the full D3D11On12
          # stack, which this lane does not have.
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -o d3d11_e2e_overhead.exe \
            tests/e2e_d3d11_overhead.cpp -ld3d12 -ld3d11 -luuid
          # Compiled only: a hardware probe, run through Whisky on D3DMetal.
          x86_64-w64-mingw32-clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -o peak_on12_probe.exe \
            tests/peak_on12_probe.cpp -luuid

      - name: Run the D3D11-on-12 concurrency stress
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -c -o ddi_thread_stress.o \
            tests/ddi_thread_stress.c
          # Linked with the C driver for the same reason the core test is: if
          # the core ever needs libstdc++, this link fails.
          x86_64-w64-mingw32-gcc -o ddi_thread_stress.exe \
            ddi_thread_stress.o d3d11on12core.o wine_d3d11_diag.o \
            -ld3d12 -ldxgi -ldxguid -luuid
          # Captured, because the flood check cannot live inside the test: the
          # diagnostics reach Wine's internal sink rather than the process's
          # stdio, and a test that picked a sink would be testing the
          # launcher.  Twelve threads times 400 iterations call each reporting
          # path, so a latch that stopped latching shows up as hundreds of
          # lines rather than one.
          set +e
          wine ddi_thread_stress.exe > stress-stdout.txt 2> stress-stderr.txt
          status=$?
          set -e
          cat stress-stdout.txt
          if [ "$status" -ne 0 ]; then
            echo '--- captured diagnostics ---'
            cat stress-stderr.txt
            exit "$status"
          fi
          python3 - <<'PY'
          import pathlib
          import sys

          # One line per condition, no matter how many threads raced for it.
          # The substrings are the stable part of each message in
          # d3d11on12core.cpp; matching the whole line would break on a
          # rewording that changed nothing about the latch.
          once = [
              "does not implement ID3D12Device",
              "does not implement ID3D12CommandQueue",
              "would not report its owning ID3D12Device",
              "refusing to assume they match",
              "reports zero nodes",
              "validated but not yet translated",
              "experimental frame publication is disabled",
          ]
          text = pathlib.Path("stress-stderr.txt").read_text(errors="replace")
          errors = []
          for needle in once:
              count = text.count(needle)
              if count != 1:
                  errors.append(f"{count} occurrences of {needle!r}, expected 1")
          if errors:
              print(text, file=sys.stderr)
              raise SystemExit("\n".join(errors))
          print("diagnostic flood gate: each of the 7 latches reported once")
          PY

      - name: Run the D3D11 router fail-closed tests
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Irelay12-d3d11 -o d3d11shimstatus.exe tests/d3d11shimstatus.c
          # Its own directory, holding the router and nothing else: no
          # d3d11mt.dll and no d3d11on12core.dll, which is the broken
          # deployment the router has to survive with documented return codes.
          # The application directory is searched first, so this is the router
          # built in this job.
          mkdir -p shim-fail-closed
          cp d3d11shim.dll d3d11shimstatus.exe shim-fail-closed/
          test ! -e shim-fail-closed/d3d11mt.dll
          test ! -e shim-fail-closed/d3d11on12core.dll
          cd shim-fail-closed
          wine d3d11shimstatus.exe

      - name: Validate the clean-room DDI declarations and negotiation
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          # The Wine D3D11 frontend is C and the host will be C++, so the DDI
          # declarations must be valid and identical in both languages.
          # -static so both binaries run in a bare prefix with no toolchain
          # DLLs beside them.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -static \
            -Irelay12-d3d11/ddi -o d3d11ddilayout.exe tests/d3d11ddilayout.c
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -o d3d11ddilayoutxx.exe tests/d3d11ddilayout.c
          wine d3d11ddilayout.exe
          wine d3d11ddilayoutxx.exe
          # The layout harness proves each promoted slot is callable, one at a
          # time and in slot order.  This one drives the slots in the order a
          # frame issues them and checks the handles flow from each creation
          # to the binding that consumes it -- the failure where every call is
          # individually well typed and the frame still binds the wrong
          # object.  Both languages, and -static, for the reasons above.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -static \
            -Irelay12-d3d11/ddi -o d3d11ddi_triangle.exe \
            tests/d3d11ddi_triangle.c
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -o d3d11ddi_trianglexx.exe tests/d3d11ddi_triangle.c
          wine d3d11ddi_triangle.exe
          wine d3d11ddi_trianglexx.exe
          # Anonymous padding in a structure the host allocates is bytes the
          # driver reads and the host never wrote, and every offset assertion
          # holds either way.  -Wpadded is the only thing that sees it, so the
          # DDI declarations are compiled alone under it.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Wpadded -Werror \
            -Irelay12-d3d11/ddi -c -o d3d11ddipadding.o tests/d3d11ddipadding.c
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Wpadded -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c -o d3d11ddipaddingxx.o tests/d3d11ddipadding.c
          # Prove unpromoted device slots reject callback arguments.
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddiplaceholdernegative.c; then
            echo "unpromoted device slot unexpectedly accepted arguments"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddiplaceholdernegative.c; then
            echo "unpromoted C++ device slot unexpectedly accepted arguments"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddideferredpromotednegative.c; then
            echo "promoted deferred-context slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddideferredpromotednegative.c; then
            echo "promoted C++ deferred-context slot accepted the wrong handle type"
            exit 1
          fi
          # And the other half: a promoted slot must reject the wrong
          # arguments.  A promotion that transcribed the parameter list wrongly
          # changes no offset and no size, so nothing above would see it.
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddipromotednegative.c; then
            echo "promoted device slot unexpectedly accepted the wrong handle"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddipromotednegative.c; then
            echo "promoted C++ device slot unexpectedly accepted the wrong handle"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddiresourcepromotednegative.c; then
            echo "promoted resource slot accepted the wrong argument structure"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddiresourcepromotednegative.c; then
            echo "promoted C++ resource slot accepted the wrong argument structure"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddiviewpromotednegative.c; then
            echo "promoted view slot accepted the wrong handle or argument structure"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddiviewpromotednegative.c; then
            echo "promoted C++ view slot accepted the wrong handle or argument structure"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddishaderpromotednegative.c; then
            echo "promoted shader slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddishaderpromotednegative.c; then
            echo "promoted C++ shader slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddistatepromotednegative.c; then
            echo "promoted state slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddistatepromotednegative.c; then
            echo "promoted C++ state slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-gcc -std=gnu11 -Wall -Wextra -Werror \
            -Irelay12-d3d11/ddi -c tests/d3d11ddidrawpromotednegative.c; then
            echo "promoted binding slot accepted the wrong handle type"
            exit 1
          fi
          if x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -Irelay12-d3d11/ddi -x c++ \
            -c tests/d3d11ddidrawpromotednegative.c; then
            echo "promoted C++ binding slot accepted the wrong handle type"
            exit 1
          fi
          # GetSupportedVersions writes its own count of words whenever the
          # buffer pointer is non-null, so the count it takes is not a
          # capacity.  These cases are what stands between that and a buffer
          # overrun in the host, and they run in both languages for the same
          # reason the layout harness does.
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -static \
            -Irelay12-d3d11 -Irelay12-d3d11/ddi -o d3d11ddinegotiate.exe \
            tests/d3d11ddinegotiate.c
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static \
            -fno-exceptions -fno-rtti -Irelay12-d3d11 -Irelay12-d3d11/ddi -x c++ \
            -o d3d11ddinegotiatexx.exe tests/d3d11ddinegotiate.c
          wine d3d11ddinegotiate.exe
          wine d3d11ddinegotiatexx.exe
          # A second opinion about the same offsets.  The compiled assertions
          # only prove the header is self-consistent: transcribe a member list
          # wrongly, assert the offsets that follow from it, and both agree.
          # This model derives them by walking member lists instead, so it
          # catches a hand-edited offset, an unasserted field, and an
          # assertion for a field nothing derives from the specification.
          python3 scripts/gen_ddi_layout.py --check
          python3 scripts/check_ddi_header.py

      - name: Verify reproducible source package
        run: |
          set -euo pipefail
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
          sh scripts/package-d3d11on12-source.sh source-one.tar.gz
          sh scripts/package-d3d11on12-source.sh source-two.tar.gz
          cmp source-one.tar.gz source-two.tar.gz
          mv source-one.tar.gz d3d11on12-source.tar.gz
          tar -tzf d3d11on12-source.tar.gz > source-files.txt
          grep -q '^relay12/third_party/D3D11On12/LICENSE$' source-files.txt
          grep -q '^relay12/third_party/D3D12TranslationLayer/LICENSE$' \
            source-files.txt
          grep -q '^relay12/third_party/DirectX-Headers/LICENSE$' \
            source-files.txt

      - name: Stage real-driver artifacts separately from the mock
        run: |
          mkdir -p artifacts/first-frame
          cp d3d11shim.dll artifacts/first-frame/d3d11.dll
          cp d3d11on12core.dll d3d11on12host.dll d3d11_e2e_triangle.exe d3d11_e2e_wrapped.exe artifacts/first-frame/
          cp "$RUNNER_TEMP/d3d11on12-build/src/d3d11on12.dll" artifacts/first-frame/

      - name: Upload first-frame runtime
        uses: actions/upload-artifact@v7
        with:
          name: first-frame-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/first-frame/
          if-no-files-found: error
          retention-days: 14

      - name: Upload D3D11-on-12 development artifacts
        uses: actions/upload-artifact@v7
        with:
          name: d3d11on12probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            d3d11on12probe.exe
            d3d11on12coretest.exe
            d3d11on12frame.exe
            d3d11on12wrapped.exe
            d3d11on12frontend.exe
            d3d11shimstatus.exe
            d3d11ddilayout.exe
            d3d11ddi_triangle.exe
            d3d11ddinegotiate.exe
            ddi_thread_stress.exe
            d3d11shim.dll
            d3d11on12core.dll
            d3d11on12-source.tar.gz
          if-no-files-found: error
          retention-days: 14
